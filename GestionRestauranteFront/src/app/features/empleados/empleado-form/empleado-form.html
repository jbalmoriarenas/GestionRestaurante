<div class="empleado-form-page">
  <div class="header">
    <h1>{{ (esEdicion() ? 'empleados.form.editTitle' : 'empleados.form.newTitle') | translate }}</h1>
  </div>

  <ui-card>
    <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
      <ui-input [label]="'empleados.form.nombre' | translate" formControlName="nombre" />
      <ui-input [label]="'empleados.form.apellidos' | translate" formControlName="apellidos" />
      <ui-input
        [label]="'empleados.form.email' | translate"
        type="email"
        [placeholder]="'empleados.form.emailPlaceholder' | translate"
        formControlName="email"
        [errorMessage]="emailErrorMessage()"
      />
      <ui-input
        [label]="'empleados.form.dniNie' | translate"
        [placeholder]="'empleados.form.dniNiePlaceholder' | translate"
        formControlName="dniNie"
        [errorMessage]="dniNieErrorMessage()"
      />
      <ui-input
        [label]="'empleados.form.telefono' | translate"
        [placeholder]="'empleados.form.telefonoPlaceholder' | translate"
        formControlName="telefono"
        [errorMessage]="telefonoErrorMessage()"
      />
      <ui-input [label]="'empleados.form.puesto' | translate" formControlName="puesto" />
      <ui-input [label]="'empleados.form.fechaAlta' | translate" type="date" formControlName="fechaAlta" />
      <div class="form-field">
        <ui-input
          [label]="'empleados.form.horasJornadaDiaria' | translate"
          type="number"
          [placeholder]="'empleados.form.horasJornadaDiariaPlaceholder' | translate"
          formControlName="horasJornadaDiaria"
          [errorMessage]="horasJornadaDiariaErrorMessage()"
        />
        <p class="form-hint">{{ 'empleados.form.horasJornadaDiariaAyuda' | translate }}</p>
      </div>
      <ui-select
        [label]="'empleados.form.tipoUsuario' | translate"
        [placeholder]="'common.selectOption' | translate"
        [options]="tipoUsuarioOptions()"
        formControlName="tipoUsuarioCodigo"
      />

      @if (!esEdicion()) {
        <ui-input
          [label]="'empleados.form.password' | translate"
          type="password"
          autocomplete="new-password"
          placeholder="********"
          formControlName="password"
          [showPasswordLabel]="'common.showPassword' | translate"
          [hidePasswordLabel]="'common.hidePassword' | translate"
          [errorMessage]="passwordErrorMessage()"
        />
      }

      <div class="form-actions">
        <ui-button type="button" variant="secondary" (click)="volver()">{{ 'common.back' | translate }}</ui-button>
        <ui-button type="submit" [loading]="loading()">{{ 'common.save' | translate }}</ui-button>
      </div>
    </form>
  </ui-card>
</div>
