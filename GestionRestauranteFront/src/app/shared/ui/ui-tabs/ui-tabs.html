<div class="ui-tabs">
  <div class="ui-tabs__header" role="tablist">
    @for (tab of tabs(); track tab.id) {
      <button
        type="button"
        role="tab"
        class="ui-tabs__tab"
        [class.ui-tabs__tab--active]="tab.id === activeTabId()"
        [attr.aria-selected]="tab.id === activeTabId()"
        (click)="selectTab(tab.id)"
      >
        {{ tab.label }}
      </button>
    }
  </div>
  <div class="ui-tabs__content">
    <ng-content />
  </div>
</div>
