spring.application.name=GestionRestauranteBack

spring.datasource.url=jdbc:mysql://localhost:3306/gestion_restaurante?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Credenciales por variable de entorno (obligatorias, sin valor por defecto): nunca commitear
# una contrasena real. En IntelliJ: Run Configuration > Environment variables; en terminal:
# DB_USERNAME=gestor DB_PASSWORD=Gestor.2026 ./mvnw spring-boot:run
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Admin inicial creado en el primer arranque si la tabla empleados esta vacia (ver AdminSeeder).
# Password con valor por defecto (no es un secreto real: es la contrasena de un unico arranque
# en vacio, pensada para cambiarse desde la app despues) pero sobreescribible por variable de entorno.
app.admin-seed.email=admin@gestionrestaurante.local
app.admin-seed.password=${ADMIN_SEED_PASSWORD:Admin.2026}

# JWT - en un entorno real este secreto debe venir de una variable de entorno, no ir commiteado
app.jwt.secret=cambia-este-secreto-por-uno-largo-y-aleatorio-de-al-menos-32-bytes-en-produccion
app.jwt.expiration-ms=28800000

app.cors.allowed-origin=http://localhost:4200

# Horas teoricas de una jornada completa, usadas como referencia en "Mi Fichaje" (y, en
# el futuro, por empleado en la vista Admin de fichajes si hiciera falta jornada parcial).
app.fichajes.horas-jornada-default=8

# Nominas (Fase 3): subida de PDFs individual/ZIP. Sin limite explicito hasta ahora el valor
# por defecto de Spring Boot (1MB) rechazaria PDFs de nomina reales sin ningun aviso claro.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.base-path=${STORAGE_BASE_PATH:./uploads}

# Extraccion OCR de facturas (Fase 2.3). Tesseract debe estar instalado en el entorno (motor
# nativo, no solo la dependencia Tess4J). Por defecto apunta a ./.tessdata (carpeta local no
# versionada, ver README "OCR de facturas") para no tener que exportar TESSDATA_PATH a mano en
# cada sesion de desarrollo; el fallo solo aparece al usar POST /api/facturas/extraer, no al
# arrancar, si la carpeta no existe o esta vacia.
app.ocr.tessdata-path=${TESSDATA_PATH:./.tessdata}
app.ocr.idioma=${OCR_IDIOMA:spa}

# Envio de nominas por email (Fase 3.3). Valores por defecto vacios/localhost para no romper
# el arranque si no estan seteados: Spring Mail no valida credenciales al arrancar, solo al
# enviar (ver EmailServiceImpl).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Interruptor general del envio real de correos nominas
nominas.enabled=false

# Valoraciones (Fase 4): conexion OAuth con Google Business Profile y sincronizacion de reseñas.
# client-id/client-secret/token-encryption-key SIN valor por defecto a proposito (a diferencia
# de app.jwt.secret): un refresh token de Google es mas sensible que la mayoria de secretos ya
# gestionados por el proyecto, el arranque debe fallar explicitamente si no estan definidos en
# vez de arrancar con una clave de ejemplo conocida (back/fase4-1-back.md).
app.google.client-id=${GOOGLE_CLIENT_ID}
app.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/valoraciones/conexion/callback}
# Clave AES-256 en Base64 para cifrar el refresh token en reposo (TokenEncryptionService).
# Generar con, p.ej.: openssl rand -base64 32
app.google.token-encryption-key=${GOOGLE_TOKEN_ENCRYPTION_KEY}
# Cron de la sincronizacion periodica (cada 6h por defecto) y URL base del front, para construir
# la redireccion tras el callback OAuth.
app.valoraciones.sync-cron=${VALORACIONES_SYNC_CRON:0 0 */6 * * *}
app.front.base-url=${FRONT_BASE_URL:http://localhost:4200}
