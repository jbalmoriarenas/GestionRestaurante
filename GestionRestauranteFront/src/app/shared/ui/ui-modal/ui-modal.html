@if (open()) {
  <div class="ui-modal-backdrop" (click)="handleBackdropClick()">
    <div class="ui-modal" role="dialog" aria-modal="true" [attr.aria-label]="title()" tabindex="-1" #panel (click)="$event.stopPropagation()">
      <header>
        <h3>{{ title() }}</h3>
        <button type="button" class="close" (click)="closed.emit()" [attr.aria-label]="closeLabel()">✕</button>
      </header>
      <div class="ui-modal-body">
        <ng-content />
      </div>
      <footer>
        <ng-content select="[modal-footer]" />
      </footer>
    </div>
  </div>
}
