<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <img src="logo.jpg" alt="" class="login-logo" />
    <h1>{{ 'login.title' | translate }}</h1>

    <ui-input
      [label]="'login.email' | translate"
      type="email"
      [placeholder]="'login.emailPlaceholder' | translate"
      formControlName="email"
      [errorMessage]="form.controls.email.touched && form.controls.email.invalid ? ('login.emailError' | translate) : null"
    />

    <ui-input
      [label]="'login.password' | translate"
      type="password"
      placeholder="••••••••"
      formControlName="password"
      [errorMessage]="form.controls.password.touched && form.controls.password.invalid ? ('login.passwordError' | translate) : null"
    />

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }

    <ui-button type="submit" [loading]="loading()">{{ 'login.submit' | translate }}</ui-button>
  </form>
</div>
