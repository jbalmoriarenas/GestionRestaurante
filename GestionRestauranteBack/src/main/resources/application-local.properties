# Overrides de entorno local de desarrollo (perfil "local"). Se activa con
# SPRING_PROFILES_ACTIVE=local (o -Dspring.profiles.active=local) al arrancar; sin ese perfil
# activo, el arranque usa unicamente application.properties (configuracion de produccion).
#
# Con el envio real habilitado en local se puede probar el flujo de Nominas de punta a punta
# contra un SMTP de pruebas (Mailhog/Mailtrap) sin arriesgar un envio real en produccion.
nominas.enabled=true

# MailDev local (`volta run npx maildev@2.1.0 --smtp 1025 --web 1081`): captura los correos sin
# enviarlos de verdad, se ven en http://localhost:1081. No requiere autenticacion ni TLS.
# El puerto 1080 se evita a proposito: choca con el proxy/seguridad local de algunos equipos
# de desarrollo (visto en esta maquina) y rompe el CORS del navegador para otras peticiones.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
