<div class="ui-field">
  @if (label()) {
    <label [for]="id">{{ label() }}@if (required()) {<span class="required-mark" aria-hidden="true"> *</span>}</label>
  }
  <input
    #input
    type="file"
    [id]="id"
    [accept]="accept()"
    [disabled]="disabled()"
    [attr.required]="required() ? '' : null"
    [class.invalid]="errorMessage()"
    [attr.aria-describedby]="errorMessage() ? errorId : null"
    (change)="handleChange($event)"
    (blur)="handleBlur()"
  />
  <span class="ui-file-input__nombre">{{ fileName() ?? noFileLabel() }}</span>
  @if (errorMessage()) {
    <span class="error" [id]="errorId">{{ errorMessage() }}</span>
  }
</div>
