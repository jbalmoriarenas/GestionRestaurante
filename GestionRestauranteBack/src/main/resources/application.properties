spring.application.name=GestionRestauranteBack

spring.datasource.url=jdbc:mysql://localhost:3306/gestion_restaurante?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Credenciales por variable de entorno (obligatorias, sin valor por defecto): nunca commitear
# una contrasena real. En IntelliJ: Run Configuration > Environment variables; en terminal:
# DB_USERNAME=gestor DB_PASSWORD=Gestor.2026 ./mvnw spring-boot:run
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Admin inicial creado en el primer arranque si la tabla empleados esta vacia (ver AdminSeeder).
# Password con valor por defecto (no es un secreto real: es la contrasena de un unico arranque
# en vacio, pensada para cambiarse desde la app despues) pero sobreescribible por variable de entorno.
app.admin-seed.email=admin@gestionrestaurante.local
app.admin-seed.password=${ADMIN_SEED_PASSWORD:Admin.2026}

# JWT - en un entorno real este secreto debe venir de una variable de entorno, no ir commiteado
app.jwt.secret=cambia-este-secreto-por-uno-largo-y-aleatorio-de-al-menos-32-bytes-en-produccion
app.jwt.expiration-ms=28800000

app.cors.allowed-origin=http://localhost:4200

# Horas teoricas de una jornada completa, usadas como referencia en "Mi Fichaje" (y, en
# el futuro, por empleado en la vista Admin de fichajes si hiciera falta jornada parcial).
app.fichajes.horas-jornada-default=8

# Nominas (Fase 3): subida de PDFs individual/ZIP. Sin limite explicito hasta ahora el valor
# por defecto de Spring Boot (1MB) rechazaria PDFs de nomina reales sin ningun aviso claro.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.base-path=${STORAGE_BASE_PATH:./uploads}

# Envio de nominas por email (Fase 3.3). Valores por defecto vacios/localhost para no romper
# el arranque si no estan seteados: Spring Mail no valida credenciales al arrancar, solo al
# enviar (ver EmailServiceImpl).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Interruptor general del envio real de correos nominas
nominas.enabled=false
