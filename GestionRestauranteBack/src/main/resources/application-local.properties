# Overrides de entorno local de desarrollo (perfil "local"). Se activa con
# SPRING_PROFILES_ACTIVE=local (o -Dspring.profiles.active=local) al arrancar; sin ese perfil
# activo, el arranque usa unicamente application.properties (configuracion de produccion).
#
# Con el envio real habilitado en local se puede probar el flujo de Nominas de punta a punta
# contra un SMTP de pruebas (Mailhog/Mailtrap) sin arriesgar un envio real en produccion.
nominas.enabled=true

# SMTP real de Gmail para pruebas en local (sustituye a MailDev, a peticion del usuario): los
# correos llegan de verdad a la bandeja de entrada real, no se capturan en una interfaz local.
# MAIL_PASSWORD debe ser una "contraseña de aplicacion" de Gmail (no la contraseña normal de la
# cuenta - Gmail exige 2FA + contraseña de aplicacion para SMTP AUTH desde 2022), generada en
# https://myaccount.google.com/apppasswords. Sin valor por defecto a proposito (sensible, mismo
# criterio que GOOGLE_TOKEN_ENCRYPTION_KEY): el arranque en local falla si no esta definida.
#
# Para volver a MailDev (`volta run npx maildev@2.1.0 --smtp 1025 --web 1081`), sustituir estas
# 6 lineas por host=localhost, port=1025, username/password vacios, auth/starttls=false.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:configrestaurante@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
